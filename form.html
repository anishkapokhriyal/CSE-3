<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Form</title>   
</head>
    <body>
        <fieldset>
            <legend>Biodata</legend>
            <form action="./response.html">
            <form action="form.html" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required><br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="50" placeholder="Enter your message" required></textarea><br><br>
                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>
                <label for="gender">Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label><br>  
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label><br>
                <input type="radio" id="other" name="gender" value="other" required>
                <label for="other">Other</label><br><br>
                <label for="hobbies">Hobbies:</label><br>
                <input type="checkbox" id="reading" name="hobbies" value="reading">
                <label for="reading">Reading</label><br>
                <input type="checkbox" id="swimming" name="hobbies" value="swimming">
                <label for="swimming">Swimming</label><br>
                <input type="checkbox" id="coding" name="hobbies" value="coding">
                <label for="coding">Coding</label><br><br>
                <select name="language" id="language" required>
                    <option value="">Select your favorite programming language</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="java">Java</option>
                    <option value="csharp">C#</option>
                </select><br><br>
                <label for="DOB">Date of Birth:</label>
                <input type="date" id="DOB" name="DOB" required><br><br>
                <label for="attempt">Attempt:</label>
                <input type="text" id="attempt" name="attempt" required><br><br>
                <label for="url">Enter your URL:</label>
                <input type="url" id="url" name="url" placeholder="https://example.com" required><br><br>
                <label for="file">Choose your file:</label>
                <input type="file" id="file" name="file" required><br><br>
                <label for="color">Choose your favorite color:</label>
                <input type="color" id="color" name="color" required><br><br>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </form>
        </fieldset>
    </body>
</html>
